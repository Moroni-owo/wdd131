<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review</title>
  <link rel="stylesheet" href="styles/form.css">
  <script defer src="scripts/form.js"></script>
  <script defer src="scripts/footer.js"></script>
</head>
<body>

<header>
  <h1>Product Review</h1>
</header>

<main>

  <form method="get" action="review.html">

    <!-- Product Name -->
    <label for="product">Product Name</label>
    <select name="product" id="product" required>
      <option value="" disabled selected>Select a Product ...</option>
    </select>

    <!-- Rating -->
    <fieldset>
      <legend>Overall Rating</legend>

      <label><input type="radio" name="rating" value="1" required> ☆</label>
      <label><input type="radio" name="rating" value="2"> ☆☆</label>
      <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
      <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
      <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>

    </fieldset>

    <!-- Date Installed -->
    <label for="install">Date of Installation</label>
    <input type="date" id="install" name="install" required>

    <!-- Useful Features -->
    <fieldset>
      <legend>Which features were useful? (Check all that apply)</legend>

      <label><input type="checkbox" name="features" value="durability"> Durability</label>
      <label><input type="checkbox" name="features" value="ease"> Ease of Use</label>
      <label><input type="checkbox" name="features" value="performance"> Performance</label>
      <label><input type="checkbox" name="features" value="design"> Design</label>

    </fieldset>

    <!-- Written Review -->
    <label for="review">Written Review (Optional)</label>
    <textarea id="review" name="review"></textarea>

    <!-- User Name -->
    <label for="user">Your Name (Optional)</label>
    <input type="text" id="user" name="user">

    <!-- Submit Button -->
    <input type="submit" value="Post Review">

  </form>
</main>

<footer>
  <p>©<span id="currentyear"></span> | Raúl Moroni Capcha Cadillo | Peru</p>
  <p id="lastModified"></p>
</footer>

</body>
</html>
