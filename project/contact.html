<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Machu Picchu Travel Guide</title>

    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <header class="header">
        <h1>Machu Picchu Travel Guide</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="places.html">Places</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="container">

        <section class="card">
            <h2>Contact Us</h2>
            <p>
                If you have any questions about planning your trip to Machu Picchu,
                feel free to send us a message.
            </p>
        </section>

        <section class="card">
            <form class="contact-form">

                <label for="name">Name</label>
                <input id="name" type="text" placeholder="Your name" required>

                <label for="email">Email</label>
                <input id="email" type="email" placeholder="Your email" required>

                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Write your message here"></textarea>

                <button type="submit">Send Message</button>

            </form>
        </section>

    </main>

    <footer class="footer">
        <p>© 2025 Machu Picchu Travel Guide</p>
    </footer>

</body>
</html>
